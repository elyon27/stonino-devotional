name: Inspect Android checkout connection
on:
  push:
    branches: [codex/check-android-checkout]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /sto-nino-devotional-1.2.25-unsigned.apk
            /sto-nino-devotional-1.2.24-unsigned.apk
          sparse-checkout-cone-mode: false
      - shell: bash
        run: |
          python3 - <<'PY'
          import re, zipfile
          with zipfile.ZipFile('sto-nino-devotional-1.2.25-unsigned.apk') as apk:
              for name in apk.namelist():
                  if not re.fullmatch(r'classes[0-9]*\.dex', name):
                      continue
                  strings = re.findall(rb'[ -~]{5,}', apk.read(name))
                  for item in strings:
                      if any(term in item for term in (b'netlify.app', b'android_asset', b'loadDataWithBaseURL', b'WebViewAssetLoader', b'prayer-packs', b'shouldInterceptRequest', b'stonino')):
                          print(item.decode()[:180])
          PY
          for host in stonino-devotional.netlify.app sto-nino-devotional.netlify.app; do
            echo "$host"
            curl -sS --max-time 12 -w '\nHTTP %{http_code}\n' "https://$host/.netlify/functions/prayer-packs?action=ready" | head -c 450 || true
          done
          apk=sto-nino-devotional-1.2.25-unsigned.apk
          unzip -p "$apk" classes.dex > app.dex
          dexdump="$(find "$ANDROID_HOME/build-tools" -name dexdump -type f | sort -V | tail -1)"
          "$dexdump" -d app.dex > dex.txt
          grep -n -E 'prayer-packs|https?://|shouldInterceptRequest|addJavascriptInterface|loadUrl|setRequestMethod|JavascriptInterface' dex.txt | cut -c1-250 | head -100
          sed -n '442,449p;705,785p' dex.txt | cut -c1-260
          unzip -Z1 "$apk" | grep -E '(app\.js|index\.html|bridge.*\.js)$'
          for asset in assets/web/index.html assets/web/assets/app.js; do
            unzip -p "$apk" "$asset" | grep -inE 'packEndpoint|window\.fetch|Native|WebView|Android|bridge' | cut -c1-500 | tail -30 || true
          done
          old=sto-nino-devotional-1.2.24-unsigned.apk
          for asset in $(unzip -Z1 "$old" | grep -E 'assets/web/(index\.html|assets/[^/]+\.js)$'); do
            unzip -p "$old" "$asset" | grep -inE 'DevotionalAndroid|NativeRequest|window\.fetch|packEndpoint' | cut -c1-500 || true
          done
          grep -n -E 'evaluateJavascript|NativeRequest;.send|const-string.*(Android|callback|window\.)' dex.txt | cut -c1-350 | head -80
          for asset in $(unzip -Z1 "$old" | grep -E 'assets/web/assets/[^/]+\.js$'); do
            if unzip -p "$old" "$asset" | grep -qF 'window.DevotionalAndroid.send'; then
              echo "BRIDGE_ASSET=$asset"
              unzip -p "$old" "$asset" | head -70
            fi
          done
          unzip -p "$old" assets/web/index.html | grep -iE '<script' | cut -c1-500
